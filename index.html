<style>
  :root{
    --paper:#F7F2E7;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --cloth:#33473B;
    --cloth-dark:#25342B;
    --brass:#B08C55;
    --line:#DCD2BE;
    --danger:#8C3B2E;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box;}
  .app{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    max-width:560px;
    margin:0 auto;
    padding-bottom:100px;
  }
  .head{
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:5;
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .head h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 2px;
    color:var(--cloth-dark);
    letter-spacing:0.2px;
  }
  .head .stats{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{
    border-color:var(--cloth);
  }
  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    stroke:var(--ink-soft);
    pointer-events:none;
  }
  .clear-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:18px;
    padding:6px;
    cursor:pointer;
    line-height:1;
  }
  .list{
    padding:6px 14px 0;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .author-row{
    border-bottom:1px solid var(--line);
  }
  .author-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 4px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .chevron{
    flex-shrink:0;
    width:18px;
    height:18px;
    stroke:var(--brass);
    transition:transform .18s ease;
  }
  .chevron.open{
    transform:rotate(90deg);
  }
  .author-info{
    flex:1;
    min-width:0;
  }
  .author-name{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
  }
  .author-count{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .author-del{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--ink-soft);
    padding:6px;
    cursor:pointer;
  }
  .author-del:hover{ color:var(--danger); }
  .books{
    padding:0 4px 16px 32px;
  }
  .book-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    font-size:14.5px;
  }
  .book-row:last-of-type{
    border-bottom:none;
  }
  .book-title{
    flex:1;
    line-height:1.4;
  }
  .book-title mark{
    background:#F0D9A8;
    color:var(--ink);
    border-radius:2px;
    padding:0 1px;
  }
  .book-del{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:16px;
    padding:4px 6px;
    cursor:pointer;
    line-height:1;
  }
  .book-del:hover{ color:var(--danger); }
  .add-book-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .add-book-row input{
    flex:1;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    background:var(--card);
    outline:none;
  }
  .add-book-row input:focus{ border-color:var(--cloth); }
  .add-book-row button{
    background:var(--cloth);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .fab{
    position:fixed;
    bottom:24px;
    right:50%;
    transform:translateX(280px);
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--cloth);
    color:#fff;
    border:none;
    font-size:28px;
    box-shadow:0 4px 14px rgba(37,52,43,0.35);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
  }
  @media (max-width:600px){
    .fab{
      right:20px;
      transform:none;
    }
  }
  .sheet-backdrop{
    position:fixed;
    inset:0;
    background:rgba(37,32,25,0.45);
    z-index:30;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:560px;
    border-radius:18px 18px 0 0;
    padding:22px 20px 28px;
    animation:slideup .18s ease;
  }
  @keyframes slideup{
    from{transform:translateY(24px); opacity:0;}
    to{transform:translateY(0); opacity:1;}
  }
  .sheet h2{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:19px;
    margin:0 0 16px;
    color:var(--cloth-dark);
  }
  .sheet label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    margin-top:14px;
  }
  .sheet label:first-of-type{ margin-top:0; }
  .sheet input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:15px;
    background:var(--card);
    outline:none;
  }
  .sheet input:focus{ border-color:var(--cloth); }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .sheet-actions button{
    flex:1;
    padding:12px;
    border-radius:9px;
    font-size:14.5px;
    font-weight:600;
    border:none;
    cursor:pointer;
  }
  .btn-cancel{
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line) !important;
  }
  .btn-save{
    background:var(--cloth);
    color:#fff;
  }
  .btn-save:disabled{
    opacity:0.5;
  }
  .confirm-text{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--cloth-dark);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13.5px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{
    opacity:1;
  }
  .loading{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
</style>

kitaplar": ["Mefatihu'l Cinan (Dua Kitabı)"]}, {"yazar": "ŞEYH SADUK İBNİ BABEVEYH", "kitaplar": ["İmam Rıza (as)'dan Hadis Pınarı"]}, {"yazar": "ŞİRALİ BAYAT", "kitaplar": ["Süreler Ve Ehli Beytten Dualar", "Şefaat Ve Evliyalara Tevessül"]}, {"yazar": "ŞİRAZİ (AYETULLAH)", "kitaplar": ["İnançlarımız", "Ehli Beyt Mektebinde Temel İnançlar"]}];

let state = {
  loading: true,
  data: [],
  search: "",
  openAuthors: new Set(),
  sheet: null, // {type: 'newAuthor'} or {type:'deleteAuthor', idx} etc
  toastMsg: "",
  toastTimer: null,
};

function trUpper(s){
  return (s||"").toLocaleUpperCase('tr-TR');
}

let db = null;
let docRef = null;
let applyingRemoteUpdate = false;
let firestoreReady = false;

function initFirestore(){
  try{
    const firebaseConfig = {
      apiKey: "AIzaSyBL6PfLkPl9V2WecXBoxq2opfSonKW6928",
      authDomain: "kitap-arsivi-6d990.firebaseapp.com",
      projectId: "kitap-arsivi-6d990",
      storageBucket: "kitap-arsivi-6d990.firebasestorage.app",
      messagingSenderId: "461861232073",
      appId: "1:461861232073:web:e5c344348025f352519c18"
    };
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection("kitaparsivi").doc("data");
    firestoreReady = true;
  } catch(e){
    console.error("Firebase init failed", e);
    firestoreReady = false;
  }
}

async function loadData(){
  initFirestore();

  if(!firestoreReady){
    // fallback: local only, so the app still works offline/without firebase
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      state.data = raw ? JSON.parse(raw) : SEED_DATA;
    } catch(e){
      state.data = SEED_DATA;
    }
    state.loading = false;
    render();
    return;
  }

  try{
    const snap = await docRef.get();
    if(snap.exists && snap.data() && Array.isArray(snap.data().authors)){
      state.data = snap.data().authors;
    } else {
      state.data = SEED_DATA;
      await docRef.set({ authors: state.data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
  } catch(e){
    console.error("Firestore load failed, falling back to local copy", e);
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      state.data = raw ? JSON.parse(raw) : SEED_DATA;
    } catch(e2){
      state.data = SEED_DATA;
    }
  }

  state.loading = false;
  render();

  // keep a local backup copy so the app still opens if offline next time
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch(e){}

  // listen for live changes from other devices
  if(firestoreReady){
    docRef.onSnapshot((snap)=>{
      if(!snap.exists) return;
      const remoteAuthors = snap.data() && snap.data().authors;
      if(!Array.isArray(remoteAuthors)) return;
      if(applyingRemoteUpdate) return;
      const localStr = JSON.stringify(state.data);
      const remoteStr = JSON.stringify(remoteAuthors);
      if(localStr === remoteStr) return;
      state.data = remoteAuthors;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch(e){}
      render();
    }, (err)=>{
      console.error("Firestore listen error", err);
    });
  }
}

async function persist(){
  // always keep a local backup so the app opens even without internet
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch(e){}

  if(!firestoreReady){
    return;
  }
  try{
    applyingRemoteUpdate = true;
    await docRef.set({ authors: state.data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch(e){
    console.error("Persist to Firestore failed", e);
    showToast("Bağlantı sorunu, cihazda kaydedildi");
  } finally {
    applyingRemoteUpdate = false;
  }
}

function showToast(msg){
  state.toastMsg = msg;
  render();
  clearTimeout(state.toastTimer);
  requestAnimationFrame(()=>{
    const el = document.querySelector('.toast');
    if(el) el.classList.add('show');
  });
  state.toastTimer = setTimeout(()=>{
    const el = document.querySelector('.toast');
    if(el) el.classList.remove('show');
  }, 1800);
}

function totalBooks(){
  return state.data.reduce((sum,a)=>sum+a.kitaplar.length,0);
}

function getFiltered(){
  const q = state.search.trim();
  if(!q) return state.data.map((a,i)=>({author:a, idx:i, matchedBooks:null}));
  const qUp = trUpper(q);
  const out = [];
  state.data.forEach((a,i)=>{
    const authorMatch = trUpper(a.yazar).includes(qUp);
    const matchedBooks = a.kitaplar.filter(b=>trUpper(b).includes(qUp));
    if(authorMatch || matchedBooks.length>0){
      out.push({author:a, idx:i, matchedBooks: (authorMatch && matchedBooks.length===0) ? null : (state.search.trim()? a.kitaplar.filter(b=>trUpper(b).includes(qUp)||authorMatch) : null)});
    }
  });
  return out;
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const qUp = trUpper(q);
  const upText = trUpper(text);
  const idx = upText.indexOf(qUp);
  if(idx===-1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleAuthor(idx){
  if(state.openAuthors.has(idx)) state.openAuthors.delete(idx);
  else state.openAuthors.add(idx);
  render();
}

function openNewAuthorSheet(){
  state.sheet = {type:'newAuthor', yazar:'', kitap:''};
  render();
}

function openDeleteAuthorConfirm(idx){
  state.sheet = {type:'deleteAuthor', idx};
  render();
}

function closeSheet(){
  state.sheet = null;
  render();
}

async function saveNewAuthor(){
  const yazar = (document.getElementById('newAuthorName')?.value||'').trim();
  const kitap = (document.getElementById('newAuthorBook')?.value||'').trim();
  if(!yazar){ showToast("Yazar adı gerekli"); return; }
  const exists = state.data.some(a => trUpper(a.yazar)===trUpper(yazar));
  if(exists){ showToast("Bu yazar zaten listede"); return; }
  state.data.push({yazar: yazar, kitaplar: kitap ? [kitap] : []});
  state.data.sort((a,b)=> trUpper(a.yazar) < trUpper(b.yazar) ? -1 : 1);
  await persist();
  state.sheet = null;
  showToast("Yazar eklendi");
  render();
}

async function confirmDeleteAuthor(){
  const idx = state.sheet.idx;
  const name = state.data[idx].yazar;
  state.data.splice(idx,1);
  state.openAuthors.delete(idx);
  await persist();
  state.sheet = null;
  showToast(name + " silindi");
  render();
}

async function addBook(idx){
  const input = document.getElementById('addBookInput-'+idx);
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  state.data[idx].kitaplar.push(val);
  await persist();
  input.value = '';
  render();
  const again = document.getElementById('addBookInput-'+idx);
  if(again) again.focus();
}

async function deleteBook(idx, bookIdx){
  state.data[idx].kitaplar.splice(bookIdx,1);
  await persist();
  render();
}

function onSearchInput(val){
  state.search = val;
  render();
}

function renderSheet(){
  if(!state.sheet) return '';
  if(state.sheet.type === 'newAuthor'){
    return `
      <div class="sheet-backdrop" onclick="if(event.target===this) closeSheet()">
        <div class="sheet">
          <h2>Yeni yazar ekle</h2>
          <label for="newAuthorName">Yazar adı</label>
          <input id="newAuthorName" type="text" placeholder="Örn. AHMET ARSLAN" autocomplete="off" />
          <label for="newAuthorBook">İlk kitap (opsiyonel)</label>
          <input id="newAuthorBook" type="text" placeholder="Kitap adı" autocomplete="off" />
          <div class="sheet-actions">
            <button class="btn-cancel" onclick="closeSheet()">Vazgeç</button>
            <button class="btn-save" onclick="saveNewAuthor()">Kaydet</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.sheet.type === 'deleteAuthor'){
    const name = state.data[state.sheet.idx].yazar;
    const count = state.data[state.sheet.idx].kitaplar.length;
    return `
      <div class="sheet-backdrop" onclick="if(event.target===this) closeSheet()">
        <div class="sheet">
          <h2>Yazarı sil</h2>
          <p class="confirm-text"><b>${escapeHtml(name)}</b> ve kayıtlı ${count} kitabı tamamen silinecek. Bu işlem geri alınamaz.</p>
          <div class="sheet-actions">
            <button class="btn-cancel" onclick="closeSheet()">Vazgeç</button>
            <button class="btn-save" style="background:var(--danger)" onclick="confirmDeleteAuthor()">Sil</button>
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

function render(){
  const root = document.getElementById('root');
  if(state.loading){
    root.innerHTML = `<div class="app"><div class="loading">Yükleniyor...</div></div>`;
    return;
  }

  // remember which input was focused (and cursor position) before we redraw,
  // so typing doesn't close the keyboard on mobile
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id) ? activeEl.id : null;
  const activeSelStart = (activeEl && typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null;
  const activeSelEnd = (activeEl && typeof activeEl.selectionEnd === 'number') ? activeEl.selectionEnd : null;

  const filtered = getFiltered();
  const q = state.search.trim();

  let listHtml = '';
  if(filtered.length===0){
    listHtml = `<div class="empty">${q ? 'Sonuç bulunamadı.' : 'Henüz kayıt yok. Sağ alttaki + ile yazar ekleyebilirsin.'}</div>`;
  } else {
    listHtml = filtered.map(({author, idx, matchedBooks})=>{
      const isOpen = state.openAuthors.has(idx) || (q && matchedBooks);
      const booksToShow = isOpen ? author.kitaplar : [];
      let booksHtml = '';
      if(isOpen){
        booksHtml = author.kitaplar.map((b, bi)=>{
          return `
            <div class="book-row">
              <div class="book-title">${highlight(b, q)}</div>
              <button class="book-del" title="Sil" onclick="deleteBook(${idx}, ${bi})">✕</button>
            </div>
          `;
        }).join('');
        booksHtml += `
          <div class="add-book-row">
            <input id="addBookInput-${idx}" type="text" placeholder="Yeni kitap adı" autocomplete="off" onkeydown="if(event.key==='Enter') addBook(${idx})" />
            <button onclick="addBook(${idx})">Ekle</button>
          </div>
        `;
      }
      return `
        <div class="author-row">
          <div class="author-head" onclick="toggleAuthor(${idx})">
            <svg class="chevron ${isOpen?'open':''}" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            <div class="author-info">
              <div class="author-name">${highlight(author.yazar, q)}</div>
              <div class="author-count">${author.kitaplar.length} kitap</div>
            </div>
            <button class="author-del" title="Yazarı sil" onclick="event.stopPropagation(); openDeleteAuthorConfirm(${idx})">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
            </button>
          </div>
          ${isOpen ? `<div class="books">${booksHtml}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  root.innerHTML = `
    <div class="app">
      <div class="head">
        <h1>Kitap Arşivi</h1>
        <div class="stats">${state.data.length} yazar &middot; ${totalBooks()} kitap</div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="searchInput" type="text" placeholder="Yazar veya kitap ara" value="${escapeHtml(state.search)}" oninput="onSearchInput(this.value)" autocomplete="off" />
          ${state.search ? `<button class="clear-btn" onclick="onSearchInput('')">✕</button>` : ''}
        </div>
      </div>
      <div class="list">${listHtml}</div>
    </div>
    <button class="fab" title="Yeni yazar ekle" onclick="openNewAuthorSheet()">+</button>
    ${renderSheet()}
    <div class="toast">${escapeHtml(state.toastMsg)}</div>
  `;

  // restore focus (and cursor position) to whatever input was active,
  // so the keyboard stays open while typing
  if(activeId){
    const newActive = document.getElementById(activeId);
    if(newActive){
      newActive.focus();
      if(activeSelStart !== null && typeof newActive.setSelectionRange === 'function'){
        try{ newActive.setSelectionRange(activeSelStart, activeSelEnd); }catch(e){}
      }
    }
  }
}

loadData();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(e => console.error('SW kayıt hatası', e));
  });
}
</script>
